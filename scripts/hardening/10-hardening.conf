# M0 hardening drop-in for dsh-personal.service — pragmatic baseline (D13).
#
# INSTALL (human, no root needed; drop-in for the systemd --user unit):
#   mkdir -p ~/.config/systemd/user/dsh-personal.service.d
#   cp scripts/hardening/10-hardening.conf ~/.config/systemd/user/dsh-personal.service.d/10-hardening.conf
#   systemctl --user daemon-reload
#   systemctl --user restart dsh-personal.service
#   scripts/hardening/verify-unit-hardening.sh
#
# ROLLBACK (one command, restores the previous behaviour exactly):
#   rm ~/.config/systemd/user/dsh-personal.service.d/10-hardening.conf
#   systemctl --user daemon-reload && systemctl --user restart dsh-personal.service
#
# NOTE: this is a *user* unit. Mount-namespace directives may be ignored or limited by the
# user manager; verify-unit-hardening.sh reports which directives actually took effect.
# Do not add MemoryDenyWriteExecute= (breaks V8 JIT) or IPAddressDeny= (unsupported on this
# systemd build: -BPF_FRAMEWORK; also out of scope under D13).

[Service]
# Local telemetry sink: journald instead of a world-readable append file.
StandardOutput=journal
StandardError=journal

# Baseline process hygiene.
NoNewPrivileges=yes
UMask=0077
PrivateTmp=yes

# Filesystem: read-only system tree, read-only home, writable only where the service needs it.
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=%h/.dsh-personal

# Network: address-family scope only (no IP allowlist available on this host build).
# AF_NETLINK is kept because glibc getifaddrs()/Node interface enumeration uses it.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK

RestrictSUIDSGID=yes
LockPersonality=yes

# Syscall exposure: the standard service set; errors are EPERM, not SIGSYS.
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM

# NOTE: journald LogFilterPatterns= is NOT effective for --user units on this host
# (verified 2026-11-10 with a transient unit: property is stored, matching lines are
# still journaled). It was removed instead of shipping a false control. Residual: the
# web app prints its launch URL with ?token=... to stdout, so the *current process's*
# launch token appears in the user journal (mode 0640 root:systemd-journal; josh is in
# adm). Tokens are per-process — an old token returns 401 after restart — and the
# journal is excluded from backups/telemetry exports. Documented in
# research/m0-telemetry.md; a system-unit/root log redaction could replace this later.
