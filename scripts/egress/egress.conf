# egress.conf — shared defaults for scripts/egress/*.sh  (sourced by bash, not executed)
#
# Precedence: an environment variable that is already set WINS over a value in
# this file (the file uses the `: "${VAR:=default}"` form). Every script in this
# directory refuses to start if this file is missing, so when installing the
# tooling copy the whole directory (scripts/egress/ -> /usr/local/lib/dsh-egress/).
#
# ── SCOPE (D13, permanent) ──────────────────────────────────────────────────
# M0 egress = OBSERVE + ALERT only. There is NO deny list in M0.
#   observe.sh + summarize-egress.sh  ................ M0 deliverables
#   allowlist.sh + refresh-dns-sets.sh  .............. OPTIONAL upgrade artifact,
#                                                     NOT used in M0/D13, never
#                                                     applied by any M0 step.
# The expected-destination list used for alerting is expected-destinations.txt.

# ── table / target ──────────────────────────────────────────────────────────
# Dedicated nftables table. Never touches /etc/nftables.conf, UFW, or any other
# table; the only rollback for everything below is:
#     sudo nft delete table inet dsh_egress
: "${DSH_EGRESS_TABLE:=dsh_egress}"

# How to identify the service's packets in the output hook:
#   cgroup = match the systemd unit cgroup (default; today's `--user` unit, josh)
#   uid    = match every packet of a dedicated service user (future hardening)
# Both modes are supported; M0 uses cgroup.
: "${DSH_EGRESS_TARGET_MODE:=cgroup}"

# Path relative to /sys/fs/cgroup. Confirmed on the host 2026-11-10 (recon):
#   /sys/fs/cgroup/user.slice/user-1000.slice/user@1000.service/app.slice/dsh-personal.service
: "${DSH_EGRESS_CGROUP_PATH:=user.slice/user-1000.slice/user@1000.service/app.slice/dsh-personal.service}"

# Number of path components of DSH_EGRESS_CGROUP_PATH counted from the cgroup
# root. nft resolves the path string to a cgroup id when the ruleset is LOADED
# and the kernel then reports the ancestor at this level; both must agree, so the
# scripts fail loudly if this does not match the path.
#   user.slice=1 / user-1000.slice=2 / user@1000.service=3 / app.slice=4 /
#   dsh-personal.service=5
: "${DSH_EGRESS_CGROUP_LEVEL:=5}"

# Service user (uid mode). Today the service runs as josh; a future system unit
# may run as a dedicated `dsh` user — update this one line and re-run.
: "${DSH_EGRESS_SERVICE_USER:=josh}"
: "${DSH_EGRESS_SERVICE_UID:=}"            # empty = resolve DSH_EGRESS_SERVICE_USER

# ── observe (M0) ────────────────────────────────────────────────────────────
# Kernel log prefix. Keep the trailing space: `summarize-egress.sh`,
# scripts/telemetry/check-alerts.sh and grep users all match on it.
: "${DSH_EGRESS_LOG_PREFIX:=DSH-EGRESS }"
: "${DSH_EGRESS_LOG_RATE:=20/minute}"      # per-rule rate limit for kernel logs
: "${DSH_EGRESS_LOG_BURST:=40}"            # packets; `log` statements are limited
: "${DSH_EGRESS_LOG_LEVEL:=info}"

# 1 = do not log/count loopback traffic (systemd-resolved stub 127.0.0.53, local
# Hindsight/DSH web). Loopback stays reachable either way: observe accepts all.
: "${DSH_EGRESS_IGNORE_LOOPBACK:=1}"

# 1 = also keep per-destination packet counters in dynamic sets (seen_v4/v6).
# These are exact; the kernel log above is rate-limited and therefore a lower
# bound. Requires nft >= 1.0.x dynset support (host: 1.0.9).
: "${DSH_EGRESS_PER_DEST_COUNTERS:=1}"
: "${DSH_EGRESS_SEEN_TIMEOUT:=24h}"        # idle expiry for per-destination counters
: "${DSH_EGRESS_SEEN_SIZE:=65535}"

# ── optional deny artifact (D13: NOT part of M0, do not apply) ──────────────
: "${DSH_EGRESS_DENY_PREFIX:=DSH-EGRESS-DENY }"
: "${DSH_EGRESS_DENY_RATE:=20/minute}"
: "${DSH_EGRESS_DENY_BURST:=40}"
: "${DSH_EGRESS_DENY_LEVEL:=warn}"

# Hostname->IP sets for the optional allowlist. Elements are refreshed by
# refresh-dns-sets.sh from the hostname lines of expected-destinations.txt.
: "${DSH_EGRESS_DNS_SET_TTL:=15m}"         # element expiry: stale after 15m if the timer dies
: "${DSH_EGRESS_NPM_TTL:=1h}"              # npm-on window length
: "${DSH_EGRESS_NPM_HOSTNAMES:=registry.npmjs.org}"

# Static destinations the optional allowlist would always permit.
: "${DSH_EGRESS_ALLOW_V4_CIDRS:=127.0.0.0/8 192.168.1.0/24 100.64.0.0/10}"
: "${DSH_EGRESS_ALLOW_V6_CIDRS:=::1/128 fd7a:115c:a1e0::/48}"

# ── expected destinations (M0 alerting contract) ────────────────────────────
# Single source of truth for "expected" egress; hostname lines are resolved with
# getent at run time, IP/CIDR lines are matched literally. Hostnames here are
# also what the optional allowlist refresher loads into its sets.
: "${DSH_EGRESS_EXPECTED_FILE:=$SCRIPT_DIR/expected-destinations.txt}"

# Fallback hostname list used only when the expected file is unreadable.
: "${DSH_EGRESS_HOSTNAMES:=api.deepseek.com opencode.ai api.telegram.org open.feishu.cn open.larksuite.com api.day.app ntfy.sh}"

# ── tooling ─────────────────────────────────────────────────────────────────
: "${DSH_EGRESS_NFT:=}"                    # empty = auto-detect /usr/sbin/nft
: "${DSH_EGRESS_JOURNAL_SOURCE:=auto}"     # auto|journal|dmesg (summarize-egress.sh)
# Artifact directory written by `summarize-egress.sh --write-artifacts` (relative
# paths are resolved against the repository root, i.e. this script's ../..).
: "${DSH_EGRESS_ARTIFACT_DIR:=artifacts/egress}"
